# Mobile Manipulator Robot Type Definition
metadata:
  name: moma
  description: "Pick and place robot with navigation capabilities"

deployment:
  docker_host: localhost  # Default to local deployment for testing
  docker_port: 2375

taskServer:
  host: "host.docker.internal"
  port: 8001

container:
  image: robotfleet/moma_robot:1.0
  environment:
    ROBOT_ID: ""  # Will be set when instantiating
    LOG_LEVEL: info
    PORT: "8001"  # Default port for the robot server
    ARM_CONFIG: ""  # Required for arm control
    GRIPPER_CONFIG: ""  # Required for gripper control
  required_devices:
    - /dev/ttyUSB*  # For arm and gripper

capabilities:
  - navigation
  - manipulation
  - has a single two-finger claw-like gripper that can pick up and place objects